<!doctype html>

  <style>

<body>

      <rect width="1200" height="520" fill="#f5f5f5"/>

      <rect x="312" y="68" width="272" height="364" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <rect x="324" y="72" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="372" y="80" fill="rgba(45,49,66,.48)" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">02 ROUTE</text>

      <rect x="608" y="68" width="280" height="364" rx="8" fill="rgba(235,108,54,.03)" stroke="rgba(235,108,54,.2)" stroke-width=".8"/>

      <rect x="912" y="68" width="264" height="364" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <rect x="924" y="72" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="972" y="80" fill="rgba(45,49,66,.48)" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">04 VERIFY</text>

      <line x1="208" y1="172" x2="336" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <text x="664" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">L1 ACT</text>
        <text x="716" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist,sans-serif" text-anchor="middle">DOM 合成事件</text>
        <text x="716" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">轻量快速 · 光标指示动画</text>
      </g>

      <!-- Node 5: L2 Action (Focal Node) -->
      <g>

        <rect x="640" y="304" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,.5)"/>
        <text x="664" y="312" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">L2 CDP</text>
        <text x="716" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist,sans-serif" text-anchor="middle">真实原生物理事件</text>

        <rect x="944" y="140" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.4)"/>

      <text x="40" y="492" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">LEGEND</text>

      <rect x="680" y="480" width="24" height="16" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
