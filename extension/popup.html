<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light;
    --canvas: #f8fafc;
    --surface: #ffffff;
    --surface-elevated: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --quiet: #94a3b8;
    --line: #e2e8f0;
    --blue: #2563eb;
    --blue-soft: #eff6ff;
    --green: #059669;
    --green-soft: #ecfdf5;
    --navy: #0b1329;
    --navy-card: #15203b;
    --amber: #d97706;
    --amber-soft: #fffbeb;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    width: 356px;
    margin: 0;
    color: var(--ink);
    background: var(--canvas);
    font: 500 12px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 16px 13px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .brand-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, .08);
  }

  .brand-copy { min-width: 0; }
  .brand-line { display: flex; align-items: baseline; gap: 7px; }
  h1 { margin: 0; font-size: 16px; line-height: 1.1; font-weight: 750; letter-spacing: -.02em; }
  #ver {
    color: var(--quiet);
    font-size: 10px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  .sub { margin-top: 3px; color: var(--muted); font-size: 10px; }

  main { padding: 12px; display: grid; gap: 10px; }

  /* 当前标签页实时受控感知条 */
  .tab-status {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 11px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    box-shadow: 0 1px 3px rgba(15,23,42,.03);
    transition: all .18s ease;
  }
  .tab-status[data-controlled="true"] {
    background: var(--blue-soft);
    border-color: rgba(37, 99, 235, .28);
    color: var(--blue);
  }
  .status-badge-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--quiet);
    flex: none;
  }
  .status-badge-dot.safe { background: #10b981; }
  .status-badge-dot.on { box-shadow: 0 0 0 2px rgba(37, 99, 235, .2); }
  .status-badge-dot.square { border-radius: 2px; }

  .connection {
    position: relative;
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) auto;
    gap: 11px;
    align-items: center;
    min-height: 80px;
    padding: 14px 15px;
    overflow: hidden;
    color: #f8fafc;
    background: linear-gradient(145deg, #0b1329 0%, #15203b 100%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 13px;
    box-shadow: 0 12px 28px rgba(11, 19, 41, 0.22);
  }

  .conn-icon {
    position: relative;
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    color: #a7f3d0;
    background: rgba(255,255,255,.08);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.09);
  }

  .conn-icon::after {
    content: '';
    position: absolute;
    right: -2px;
    bottom: -2px;
    width: 8px;
    height: 8px;
    border: 2px solid var(--navy);
    border-radius: 50%;
    background: var(--quiet);
  }
  .connection[data-connected="true"] .conn-icon::after {
    background: #22c55e;
    box-shadow: 0 0 0 2px rgba(34, 197, 94, .3);
  }

  .conn-copy { min-width: 0; }
  .label { color: #94a3b8; font-size: 10px; font-weight: 750; letter-spacing: .08em; }
  #state { margin-top: 2px; font-size: 14px; font-weight: 720; letter-spacing: -.02em; }
  #conntip { margin-top: 3px; color: #cbd5e1; font-size: 10px; font-variant-numeric: tabular-nums; }

  #btn {
    position: relative;
    z-index: 1;
    min-width: 64px;
    padding: 6px 9px;
    color: #fff;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 8px;
    background: var(--blue);
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    transition: transform .16s ease, background .16s ease;
  }
  #btn:hover { background: #1d4ed8; transform: translateY(-1px); }
  #btn:focus-visible { outline: 2px solid rgba(147,197,253,.55); outline-offset: 2px; }
  #btn:disabled { cursor: wait; opacity: .65; transform: none; }

  .panel {
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(15,23,42,.03);
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 8px;
  }
  .panel-head h2 { margin: 0; font-size: 12px; font-weight: 730; letter-spacing: -.01em; }
  .panel-meta { color: var(--quiet); font-size: 10px; }

  .setting {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr) 36px;
    gap: 9px;
    align-items: center;
    padding: 10px 12px;
    border-top: 1px solid var(--line);
  }

  .setting-icon {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    color: var(--blue);
    background: var(--blue-soft);
    border-radius: 8px;
  }
  .setting-icon.green { color: #059669; background: var(--green-soft); }
  .setting-copy { min-width: 0; }
  .setting-title { display: flex; align-items: center; gap: 6px; }
  .setting-title h3 { margin: 0; font-size: 12px; font-weight: 690; letter-spacing: -.01em; }
  .mini-dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--quiet); }
  .mini-dot.on { background: var(--green); box-shadow: 0 0 0 2px rgba(5,150,105,.18); }
  .setting p { margin: 2px 0 0; color: var(--muted); font-size: 10px; line-height: 1.45; }
  code {
    padding: 1px 4px;
    color: #475569;
    background: #eef1f5;
    border-radius: 4px;
    font: 600 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .switch {
    position: relative;
    width: 36px;
    height: 20px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: #cbd5e1;
    cursor: pointer;
    transition: background .18s ease;
  }
  .switch span {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(15,23,42,.25);
    transition: transform .2s cubic-bezier(.16,1,.3,1);
  }
  .switch.on { background: var(--green); }
  .switch.on span { transform: translateX(16px); }
  .switch:hover { filter: brightness(.97); }
  .switch:focus-visible { outline: 2px solid rgba(37,99,235,.22); outline-offset: 2px; }

  .sessions { padding-bottom: 4px; }
  .sess { display: flex; flex-direction: column; }
  .sess .s {
    display: grid;
    grid-template-columns: 10px auto auto minmax(0, 1fr);
    gap: 7px;
    align-items: center;
    min-height: 32px;
    padding: 6px 12px;
    border-top: 1px solid var(--line);
  }
  .sess .swatch {
    width: 8px;
    height: 8px;
    background: var(--session, var(--blue));
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--session, var(--blue)) 14%, transparent);
  }
  .sess .swatch.circle { border-radius: 50%; }
  .sess .swatch.square { border-radius: 2px; }
  .sess .who { font-weight: 690; font-size: 11px; white-space: nowrap; }
  .sess .code {
    padding: 1px 5px;
    color: var(--muted);
    background: #f0f3f7;
    border-radius: 999px;
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }
  .sess .page { color: var(--muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 12px; color: var(--quiet); border-top: 1px solid var(--line); font-size: 10px; }

  /* 近期审计轨迹面板 */
  .audit-trail { padding-bottom: 4px; }
  .audit-list { display: flex; flex-direction: column; }
  .audit-item {
    display: grid;
    grid-template-columns: 8px auto minmax(0, 1fr) auto;
    gap: 7px;
    align-items: center;
    min-height: 28px;
    padding: 5px 12px;
    border-top: 1px solid var(--line);
    font-size: 10px;
  }
  .audit-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--session, var(--blue));
    flex: none;
  }
  .audit-dot.square { border-radius: 1.5px; }
  .audit-dot.fail { background: #ef4444; }
  .audit-who { font-weight: 650; color: var(--ink); white-space: nowrap; font-size: 10px; }
  .audit-summary { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .audit-time { color: var(--quiet); font-variant-numeric: tabular-nums; flex: none; font-size: 9px; }

  /* 底部快捷动作与排错 */
  .footer-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .btn-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 6px 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
  }
  .btn-action:hover {
    color: var(--blue);
    border-color: rgba(37,99,235,.3);
    background: var(--blue-soft);
  }
  .btn-action:active { transform: scale(.98); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --canvas: #090e1a;
      --surface: #111a2e;
      --surface-elevated: #16223c;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --quiet: #64748b;
      --line: #1c2b48;
      --blue-soft: rgba(37, 99, 235, 0.16);
      --green-soft: rgba(5, 150, 105, 0.16);
      --navy: #070b14;
      --navy-card: #111a2e;
    }
    .panel { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
    code, .sess .code { color: #93c5fd; background: #162442; }
    .brand { border-bottom-color: var(--line); }
    .tab-status { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
  }
</style>
</head>
<body>
<header class="brand">
  <img class="brand-icon" src="icons/icon48.png" alt="" />
  <div class="brand-copy">
    <div class="brand-line">
      <h1>chrome-agent-browser</h1>
      <span id="ver"></span>
    </div>
    <div class="sub">本机 Agent 的 Chrome 执行端</div>
  </div>
</header>

<main>
  <!-- 当前标签页状态感知条 -->
  <div class="tab-status" id="tabstatus" data-controlled="false">
    <span class="status-badge-dot safe" id="tabstatusdot"></span>
    <span id="tabstatustext">当前标签页：未受控（安全浏览）</span>
  </div>

  <section class="connection" id="conn" data-connected="false" aria-live="polite">
    <div class="conn-icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 8.5 4.5 12 8 15.5M16 8.5l3.5 3.5-3.5 3.5M13.5 5l-3 14" />
      </svg>
    </div>
    <div class="conn-copy">
      <div class="label">CONNECTION</div>
      <div id="state">检查本地桥接…</div>
      <div id="conntip" hidden></div>
    </div>
    <button id="btn" hidden>重新连接</button>
  </section>

  <section class="panel" aria-labelledby="cap-title">
    <div class="panel-head">
      <h2 id="cap-title">运行能力</h2>
      <span class="panel-meta">可随时关闭</span>
    </div>

    <div class="setting">
      <div class="setting-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" />
          <circle cx="12" cy="12" r="4" />
        </svg>
      </div>
      <div class="setting-copy">
        <div class="setting-title"><span class="mini-dot" id="l2dot"></span><h3 id="l2state">原生事件通道</h3></div>
        <p id="l2tip">处理富文本、<code>isTrusted</code> 与后台截图</p>
      </div>
      <button id="l2btn" class="switch" type="button" role="switch" aria-checked="false" aria-label="开启原生事件通道"><span></span></button>
    </div>

    <div class="setting">
      <div class="setting-icon green" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c4.8 0 8.6 4.1 9.5 8-.9 3.9-4.7 8-9.5 8s-8.6-4.1-9.5-8c.9-3.9 4.7-8 9.5-8Z" />
          <circle cx="12" cy="11" r="2.8" />
        </svg>
      </div>
      <div class="setting-copy">
        <div class="setting-title"><span class="mini-dot" id="markdot"></span><h3 id="markstate">页面状态标识</h3></div>
        <p id="marktip">用颜色、形状和短码标出受控会话</p>
      </div>
      <button id="markbtn" class="switch" type="button" role="switch" aria-checked="false" aria-label="开启页面状态标识"><span></span></button>
    </div>
  </section>

  <section class="panel sessions" aria-labelledby="sessions-title">
    <div class="panel-head">
      <h2 id="sessions-title">活动会话</h2>
      <span class="panel-meta" id="sessioncount">0 个</span>
    </div>
    <div class="sess" id="sess"></div>
  </section>

  <section class="panel audit-trail" aria-labelledby="audit-title">
    <div class="panel-head">
      <h2 id="audit-title">近期操作轨迹</h2>
      <span class="panel-meta" id="auditcount">最近 10 条</span>
    </div>
    <div class="audit-list" id="auditlist"></div>
  </section>

  <!-- 底部操作快捷闭环 -->
  <div class="footer-actions">
    <button class="btn-action" id="copydoctor" type="button">
      <span>🩺 复制体检命令</span>
    </button>
    <button class="btn-action" id="copyaudit" type="button">
      <span>📜 复制审计命令</span>
    </button>
  </div>
</main>

<script src="popup.js"></script>
</body>
</html>
